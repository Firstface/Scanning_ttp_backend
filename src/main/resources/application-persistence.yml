spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/scanning_ttp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:scanning}
    password: ${DB_PASSWORD:scanning}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
app:
  auth:
    enabled: ${APP_AUTH_ENABLED:false}
  rate-limit:
    enabled: ${APP_RATE_LIMIT_ENABLED:false}
