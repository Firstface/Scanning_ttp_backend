version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - scanning-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ../../Scanning_ttp_frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    networks:
      - scanning-network
    restart: unless-stopped

  nginx-proxy:
    build:
      context: ./nginx-proxy
      dockerfile: Dockerfile
    ports:
      - "443:443"
    depends_on:
      - frontend
      - backend
    networks:
      - scanning-network
    restart: unless-stopped

networks:
  scanning-network:
    driver: bridge
