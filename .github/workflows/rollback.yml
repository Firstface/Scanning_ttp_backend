name: rollback
on:
  workflow_dispatch:
    inputs:
      image_tag: {description: Immutable tag to restore, required: true}
      environment: {description: Local compose target profile, required: true, default: production-like}
jobs:
  validate-rollback-definition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: sh -n scripts/rollback-compose.sh
      - name: Validate Compose definition
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          SPRING_PROFILE: ${{ inputs.environment }}
        run: docker compose -f deploy/docker-compose.yml config
