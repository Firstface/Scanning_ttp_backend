name: cd
on:
  workflow_dispatch:
    inputs:
      image_tag: {description: Immutable image tag, required: true}
      environment: {description: staging or production-like, required: true, default: staging, type: choice, options: [staging, production-like]}
jobs:
  deploy-local-compose-definition:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate Compose definition
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          SPRING_PROFILE: ${{ inputs.environment }}
        run: docker compose -f deploy/docker-compose.yml config
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with: {name: compose-definition, path: deploy/docker-compose.yml}
