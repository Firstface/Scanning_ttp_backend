name: ci
on:
  push:
    branches: [main, "demo/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      extended_validation:
        description: Run DAST and k6 after compose deployment
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
  security-events: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with: {distribution: temurin, java-version: '17', cache: maven}
      - run: mvn -B clean verify
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with: {name: maven-test-and-jacoco, path: "target/surefire-reports/**\ntarget/failsafe-reports/**\ntarget/site/jacoco/**"}
  sast-and-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: pipx run semgrep scan --config p/default --error --sarif --output semgrep.sarif
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.2 detect --source=/repo --no-git --config=/repo/.gitleaks.toml --report-format sarif --report-path=/repo/gitleaks.sarif
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with: {name: sast-and-secrets, path: "semgrep.sarif\ngitleaks.sarif"}
  image-and-trivy:
    needs: [test, sast-and-secrets]
    runs-on: ubuntu-latest
    env:
      TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
      TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db:1
      TRIVY_TIMEOUT: 15m
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - run: docker build -t scanning-ttp-backend:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: scanning-ttp-backend:${{ github.sha }}
          format: json
          output: trivy-image.json
          severity: HIGH,CRITICAL
          exit-code: '1'
      - uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          scan-type: fs
          format: json
          output: trivy-fs.json
          severity: HIGH,CRITICAL
          exit-code: '1'
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with: {name: trivy-reports, path: "trivy-image.json\ntrivy-fs.json"}
  extended-validation:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.extended_validation }}
    needs: image-and-trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: IMAGE_TAG=${{ github.sha }} docker compose -f deploy/docker-compose.yml up -d --build --wait
      - run: curl --fail --retry 20 --retry-delay 2 http://localhost:8088/actuator/health
      - run: npm ci --prefix tests/e2e
      - run: BASE_URL=http://localhost:8088 npm --prefix tests/e2e exec -- playwright test --config=tests/e2e/playwright.config.js
      - run: BASE_URL=http://localhost:8088 k6 run --summary-export=k6-summary.json tests/k6/load-test.js
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with: {name: extended-validation, path: "reports/e2e/**\nk6-summary.json"}
      - if: always()
        run: docker compose -f deploy/docker-compose.yml logs > deployment.log && docker compose -f deploy/docker-compose.yml down -v
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with: {name: deployment-log, path: deployment.log}
