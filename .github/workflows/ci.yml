name: CI Pipeline

on:
  push:
    branches: [main, "demo/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

permissions:
  contents: read
  packages: write
  security-events: write
  issues: write
  id-token: write

jobs:
  lint-and-scan:
    name: Lint & Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
        timeout-minutes: 5

      - name: SAST with Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/default
        continue-on-error: true
        timeout-minutes: 5

      - name: Secret Scan with Gitleaks
        run: |
          docker run --rm -v $(pwd):/path zricethezav/gitleaks:latest detect --source=/path --no-git --config=.gitleaks.toml || true
        continue-on-error: true
        timeout-minutes: 5

  unit-test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    needs: lint-and-scan
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
        timeout-minutes: 5

      - name: Run Unit Tests
        run: mvn clean test jacoco:report
        timeout-minutes: 10

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: target/site/jacoco/
        timeout-minutes: 5

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
        timeout-minutes: 5

      - name: Run Integration Tests
        env:
          SPRING_PROFILES_ACTIVE: dev
        run: mvn verify -DskipUTs
        timeout-minutes: 15

      - name: Upload Integration Test Results
        uses: actions/upload-artifact@v5
        with:
          name: failsafe-reports
          path: target/failsafe-reports/
        timeout-minutes: 5

  build-and-scan:
    name: Build & Container Scan
    runs-on: ubuntu-latest
    needs: unit-test
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
        timeout-minutes: 5

      - name: Build JAR
        run: mvn clean package -DskipTests -B
        timeout-minutes: 10

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        timeout-minutes: 5

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        timeout-minutes: 5

      - name: Lowercase repo name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
        timeout-minutes: 1

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}:${{ github.sha }},ghcr.io/${{ steps.repo.outputs.name }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ steps.repo.outputs.name }}
        timeout-minutes: 15

      - name: Run Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ steps.repo.outputs.name }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
        timeout-minutes: 10

      - name: Upload Trivy scan results
        uses: actions/upload-artifact@v5
        with:
          name: trivy-results
          path: 'trivy-results.sarif'
        timeout-minutes: 5

  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: build-and-scan
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 2

      - name: Start backend with docker compose
        working-directory: deploy
        run: |
          docker compose up -d --build backend
        timeout-minutes: 10

      - name: Wait for backend health check
        run: |
          timeout 60s bash -c 'until curl -f http://localhost:8080/actuator/health; do sleep 2; done' || (cd deploy && docker compose logs backend && exit 1)
        timeout-minutes: 2

      - name: DAST with OWASP ZAP
        run: |
          mkdir -p zap-reports
          docker run --network=host -v $(pwd)/zap-reports:/zap/wrk/:rw ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://localhost:8080 -r zap-report.html -I || true
        continue-on-error: true
        timeout-minutes: 20

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v5
        with:
          name: zap-report
          path: zap-reports/zap-report.html
        timeout-minutes: 5

      - name: Cleanup
        if: always()
        working-directory: deploy
        run: docker compose down -v
        timeout-minutes: 5

  load-test:
    name: Load Test (k6)
    runs-on: ubuntu-latest
    needs: build-and-scan
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 2

      - name: Start backend with docker compose
        working-directory: deploy
        run: |
          docker compose up -d --build backend
        timeout-minutes: 10

      - name: Wait for backend health check
        run: |
          timeout 60s bash -c 'until curl -f http://localhost:8080/actuator/health; do sleep 2; done' || (cd deploy && docker compose logs backend && exit 1)
        timeout-minutes: 2

      - name: Install k6
        uses: grafana/setup-k6-action@v1
        timeout-minutes: 5

      - name: Run Load Test
        run: k6 run tests/k6/load-test.js --summary-export=k6-summary.json
        continue-on-error: true
        timeout-minutes: 20

      - name: Upload k6 Summary
        uses: actions/upload-artifact@v5
        with:
          name: k6-summary
          path: k6-summary.json
        timeout-minutes: 5

      - name: Cleanup
        if: always()
        working-directory: deploy
        run: docker compose down -v
        timeout-minutes: 5
