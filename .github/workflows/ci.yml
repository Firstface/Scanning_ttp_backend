name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-scan:
    name: Lint & Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: SAST with Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/default
        continue-on-error: true

      - name: Secret Scan with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          report-format: json
        continue-on-error: true

  unit-test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    needs: lint-and-scan
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Unit Tests
        run: mvn clean test jacoco:report

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco/

  build-and-scan:
    name: Build & Container Scan
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        run: mvn clean package -DskipTests -B

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }},ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Run Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: 'trivy-results.sarif'

  e2e-test:
    name: E2E & Load Tests
    runs-on: ubuntu-latest
    needs: build-and-scan
    services:
      backend:
        image: ghcr.io/${{ github.repository }}:${{ github.sha }}
        ports:
          - 8080:8080
        options: >-
          --health-cmd "curl -f http://localhost:8080/actuator/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        working-directory: tests/e2e
        run: npm init -y && npm install -D @playwright/test && npx playwright install --with-deps chromium

      - name: Run E2E Tests
        working-directory: tests/e2e
        run: npx playwright test
        continue-on-error: true

      - name: Upload E2E Results
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: tests/e2e/reports/

      - name: DAST with OWASP ZAP
        uses: zaproxy/action-full-scan@v0.8.0
        with:
          target: http://localhost:8080
          rules_file_name: '.zap/rules.tsv'
        continue-on-error: true

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-full-scan-report.html

      - name: Install k6
        uses: grafana/k6-action@v0.2.0

      - name: Run Load Test
        working-directory: tests/k6
        run: k6 run load-test.js
        continue-on-error: true

      - name: Upload k6 Report
        uses: actions/upload-artifact@v4
        with:
          name: k6-report
          path: reports/k6/
